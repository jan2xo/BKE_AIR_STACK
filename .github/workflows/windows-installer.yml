name: Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 6
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.428

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - name: Verify installed runtime and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "./BKE AirStack/bke.manifest.json" -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -InstallerPath "./artifacts/installer/Air-Stack-$version-Windows-x64.exe"

      - name: Verify repository diff hygiene
        shell: pwsh
        run: git diff --check

      - name: Upload installer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Air-Stack-Windows-x64
          path: |
            artifacts/installer/Air-Stack-1.0.0-Windows-x64.exe
            artifacts/installer/Air-Stack-installer.json
          if-no-files-found: error
          retention-days: 14
