name: Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - name: Verify installed runtime and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "./BKE AirStack/bke.manifest.json" -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -InstallerPath "./artifacts/installer/Air-Stack-$version-Windows-x64.exe"

      - name: Verify repository diff hygiene
        shell: pwsh
        run: git diff --check

      - name: Upload installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: Air-Stack-Windows-x64
          path: |
            artifacts/installer/Air-Stack-1.0.0-Windows-x64.exe
            artifacts/installer/Air-Stack-installer.json
          if-no-files-found: error
          retention-days: 14
