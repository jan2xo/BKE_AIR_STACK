name: PR CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET 8 SDK selection
        shell: pwsh
        run: |
          dotnet --info
          $sdkVersion = dotnet --version
          if (-not $sdkVersion.StartsWith('8.0.')) { throw "Expected .NET SDK 8.0.x, selected $sdkVersion" }

      - name: Verify certified Desktop Licensing package
        shell: pwsh
        run: |
          $package = "packages/BKE.Desktop.Licensing.1.0.0.nupkg"
          if (-not (Test-Path -LiteralPath $package)) { throw 'Certified BKE Desktop Licensing package is missing.' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '30cae81ecbbf0f452019e987ba09d5755212e6dcac343f1f603b83988a80eeec') { throw "Unexpected BKE Desktop Licensing package hash: $hash" }

      - name: Restore
        run: dotnet restore "BKE AirStack/BKE AirStack.csproj"

      - name: Verify Desktop Licensing restore
        shell: pwsh
        run: |
          $assets = Get-Content "BKE AirStack/obj/project.assets.json" -Raw
          if ($assets -notmatch 'BKE\.Desktop\.Licensing/1\.0\.0') { throw 'BKE Desktop Licensing 1.0.0 was not restored.' }
          if ($assets -match 'BKE\.Desktop\.Client/1\.0\.0') { throw 'Legacy BKE Desktop Client must not remain in the Air Stack restore graph.' }

      - name: Build
        run: dotnet build "BKE AirStack/BKE AirStack.csproj" -c Release --no-restore

      - name: Verify licensing integration boundaries
        shell: pwsh
        run: |
          $project = Get-Content "BKE AirStack/BKE AirStack.csproj" -Raw
          $program = Get-Content "BKE AirStack/Program.cs" -Raw
          $agent = Get-Content "BKE AirStack/Licensing/AgentClient.cs" -Raw
          $module = Get-Content "BKE AirStack/Licensing/ModuleLaunchClient.cs" -Raw
          if ($project -notmatch '<TargetFramework>net8\.0-windows</TargetFramework>') { throw '.NET 8 Windows target missing' }
          if ($project -notmatch 'PackageReference Include="BKE\.Desktop\.Licensing" Version="1\.0\.0"') { throw 'BKE Desktop Licensing reference missing' }
          if ($project -match 'PackageReference Include="BKE\.Desktop\.Client"') { throw 'Legacy BKE Desktop Client reference must be removed' }
          if ($agent -notmatch 'BkeLicensingClient\.Create') { throw 'Desktop Licensing client missing' }
          if ($agent -notmatch 'EnsureAuthorizedAsync') { throw 'One-shot licensing flow missing' }
          if ($agent -notmatch 'ActivationInteraction\.NativeDesktop') { throw 'Native desktop activation policy missing' }
          if ($agent -match 'HttpClient|127\.0\.0\.1:43873|/v1/authorize|/v1/license-center/open') { throw 'Direct Licensing Agent HTTP transport must not return to Air Stack' }
          if ($program -notmatch 'agentClient\.EnsureAuthorizedAsync') { throw 'Air Stack startup must use the one-shot licensing flow' }
          if ($program -match 'RetryAuthorization|OpenNativeLicenseCenterAsync|AuthorizationStatus\.ActivationRequired') { throw 'Product-owned activation choreography must not return to Air Stack Program.cs' }
          if ($module -notmatch 'bke\.module-ipc\.v1') { throw 'Secure Render Dock module IPC schema missing' }
          if ($module -notmatch 'air-stack-render-dock-v1') { throw 'Render Dock launch policy missing' }
          if ($module -match '--air-stack|--enterprise|Environment.GetCommandLineArgs') { throw 'CLI authority is forbidden' }

      - name: Publish updater payload candidate
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath './BKE AirStack/bke.manifest.json' -Raw | ConvertFrom-Json
          $publish = './artifacts/pr-update-publish'
          dotnet publish "BKE AirStack/BKE AirStack.csproj" -c Release -r win-x64 --self-contained true --output $publish -p:PublishSingleFile=false -p:PublishTrimmed=false -p:GenerateManifests=false -p:SignManifests=false -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Updater payload publish failed.' }
          Copy-Item -LiteralPath './BKE AirStack/bke.manifest.json' -Destination (Join-Path $publish 'bke.manifest.json') -Force
          ./scripts/build-updater-payload.ps1 -PublishDirectory $publish -OutputDirectory './artifacts/pr-update' -Version ([string]$manifest.version)
          $metadata = Get-Content -LiteralPath "./artifacts/pr-update/Air-Stack-$($manifest.version)-Windows-x64.update.json" -Raw | ConvertFrom-Json
          if ($metadata.schema -ne 'bke.update-package.v1' -or $metadata.productId -ne 'bke-air-stack' -or $metadata.contentType -ne 'application/vnd.bke.update-package+zip') { throw 'Updater payload metadata contract invalid.' }
