name: Air Stack release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vmix-launch-hotfix-release.yml'
      - 'BKE AirStack/**'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Apply vMix launch hotfix for release build
        shell: pwsh
        run: |
          $path = 'BKE AirStack/Form1.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = 'Process.Start("C:\\Program Files (x86)\\vMix\\vMix64.exe", @"""D:/BKE Air Stack.vmix");'
          $new = @'
          Process.Start(new ProcessStartInfo
          {
              FileName = @"C:\Program Files (x86)\vMix\vMix64.exe",
              Arguments = "\"D:\\BKE Air Stack.vmix\"",
              WorkingDirectory = @"C:\Program Files (x86)\vMix",
              UseShellExecute = true
          });
          '@.Trim()

          if (-not $text.Contains($old)) {
            throw 'Expected legacy vMix launch line was not found. Refusing to build an unknown source state.'
          }

          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))

      - name: Restore
        run: dotnet restore 'BKE AirStack/BKE AirStack.csproj'

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish 'BKE AirStack/BKE AirStack.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish

      - name: Read existing product version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content 'BKE AirStack/bke.manifest.json' -Raw | ConvertFrom-Json
          if (-not $manifest.version) { throw 'bke.manifest.json has no version' }
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Verify application payload
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish/BKE AirStack.exe')) { throw 'Missing publish/BKE AirStack.exe' }
          if (-not (Test-Path 'publish/bke.manifest.json')) { throw 'Missing publish/bke.manifest.json' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" 'installer/AirStack.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = "installer-output/Air-Stack-$version-Windows-x64.exe"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }

      - name: Generate installer SHA-256
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "installer-output/Air-Stack-$version-Windows-x64.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Air-Stack-$version-Windows-x64.exe" | Set-Content -Encoding ascii "$installer.sha256"

      - name: Publish installer to GitHub Release without version bump
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $installer = "installer-output/Air-Stack-$version-Windows-x64.exe"
          $hashAsset = "$installer.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $hashAsset --clobber
          } else {
            gh release create $tag $installer $hashAsset `
              --title "Air Stack $version" `
              --notes "Air Stack $version Windows x64 installer built by GitHub Actions. Application version unchanged. SHA-256 checksum published alongside the installer."
          }
