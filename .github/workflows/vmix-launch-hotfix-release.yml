name: vMix launch hotfix release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vmix-launch-hotfix-release.yml'
      - 'BKE AirStack/Form1.cs'
      - 'BKE AirStack/bke.manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch vMix launch invocation
        id: patch
        shell: pwsh
        run: |
          $path = 'BKE AirStack/Form1.cs'
          $text = [IO.File]::ReadAllText($path)

          $old = 'Process.Start("C:\\Program Files (x86)\\vMix\\vMix64.exe", @"""D:/BKE Air Stack.vmix");'
          $new = @'
          Process.Start(new ProcessStartInfo
          {
              FileName = @"C:\Program Files (x86)\vMix\vMix64.exe",
              Arguments = "\"D:\\BKE Air Stack.vmix\"",
              WorkingDirectory = @"C:\Program Files (x86)\vMix",
              UseShellExecute = true
          });
          '@.Trim()

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Commit source hotfix
        if: steps.patch.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'BKE AirStack/Form1.cs'
          git commit -m "fix: launch vMix with valid quoted project path"
          git push origin HEAD:main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore 'BKE AirStack/BKE AirStack.csproj'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish 'BKE AirStack/BKE AirStack.csproj' -c Release -r win-x64 --self-contained false -o publish

      - name: Read existing product version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content 'BKE AirStack/bke.manifest.json' -Raw | ConvertFrom-Json
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "BKE-Air-Stack-${{ steps.version.outputs.version }}-win-x64.zip" -Force

      - name: Publish GitHub Release without version bump
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $asset = "BKE-Air-Stack-$version-win-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "Air Stack $version" --notes "GitHub-built Air Stack $version release. Includes the vMix project launch hotfix; application version unchanged."
          }
