name: Air Stack release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vmix-launch-hotfix-release.yml'
      - 'BKE AirStack/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Apply vMix launch hotfix for release build
        shell: pwsh
        run: |
          $path = 'BKE AirStack/Form1.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = 'Process.Start("C:\\Program Files (x86)\\vMix\\vMix64.exe", @"""D:/BKE AirStack.vmix");'
          $new = @'
          Process.Start(new ProcessStartInfo
          {
              FileName = @"C:\Program Files (x86)\vMix\vMix64.exe",
              Arguments = "\"D:\\BKE Air Stack.vmix\"",
              WorkingDirectory = @"C:\Program Files (x86)\vMix",
              UseShellExecute = true
          });
          '@.Trim()

          if (-not $text.Contains($old)) {
            throw 'Expected legacy vMix launch line was not found. Refusing to build an unknown source state.'
          }

          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))

      - name: Restore
        run: dotnet restore 'BKE AirStack/BKE AirStack.csproj'

      - name: Publish
        shell: pwsh
        run: |
          # Keep the Windows application manifest, but disable legacy ClickOnce
          # deployment-manifest generation/signing. The repository still carries
          # a developer-era temporary PFX/thumbprint that must not be required by
          # a GitHub-hosted release build.
          dotnet publish 'BKE AirStack/BKE AirStack.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:GenerateManifests=false `
            -p:SignManifests=false `
            -p:ManifestKeyFile= `
            -p:ManifestCertificateThumbprint= `
            -o publish

      - name: Read existing product version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content 'BKE AirStack/bke.manifest.json' -Raw | ConvertFrom-Json
          if (-not $manifest.version) { throw 'bke.manifest.json has no version' }
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Verify release payload
        shell: pwsh
        run: |
          $exe = 'publish/BKE AirStack.exe'
          $manifest = 'publish/bke.manifest.json'
          if (-not (Test-Path $exe)) { throw "Missing release executable: $exe" }
          if (-not (Test-Path $manifest)) { throw "Missing product manifest: $manifest" }

      - name: Package release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $asset = "BKE-Air-Stack-$version-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"

      - name: Publish GitHub Release without version bump
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $asset = "BKE-Air-Stack-$version-win-x64.zip"
          $hashAsset = "$asset.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $hashAsset --clobber
          } else {
            gh release create $tag $asset $hashAsset `
              --title "Air Stack $version" `
              --notes "GitHub-built Air Stack $version release. Includes the vMix launch hotfix; application version unchanged. SHA-256 checksum is published alongside the package."
          }
