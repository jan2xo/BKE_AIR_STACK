name: Air Stack Windows installer release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vmix-launch-hotfix-release.yml'
      - 'BKE AirStack/**'
      - 'installer/**'
      - 'scripts/**'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET 6
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.428

      - name: Apply vMix launch hotfix for release build
        shell: pwsh
        run: |
          $path = 'BKE AirStack/Form1.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = 'Process.Start("C:\\Program Files (x86)\\vMix\\vMix64.exe", @"""D:/BKE Air Stack.vmix");'.Replace('\"','"')
          $new = @'
          Process.Start(new ProcessStartInfo
          {
              FileName = @"C:\Program Files (x86)\vMix\vMix64.exe",
              Arguments = "\"D:\\BKE Air Stack.vmix\"",
              WorkingDirectory = @"C:\Program Files (x86)\vMix",
              UseShellExecute = true
          });
          '@.Trim()

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
          } elseif (-not $text.Contains('WorkingDirectory = @"C:\Program Files (x86)\vMix"')) {
            throw 'Neither the legacy vMix launch nor the expected hotfix was found.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - name: Verify installed runtime and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath './BKE AirStack/bke.manifest.json' -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -InstallerPath "./artifacts/installer/Air-Stack-$version-Windows-x64.exe"

      - name: Verify repository diff hygiene
        shell: pwsh
        run: git diff --check

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath './BKE AirStack/bke.manifest.json' -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Missing product version.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Air-Stack-Windows-x64
          path: |
            artifacts/installer/Air-Stack-${{ steps.version.outputs.version }}-Windows-x64.exe
            artifacts/installer/Air-Stack-installer.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to GitHub Release without version bump
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $installer = "artifacts/installer/Air-Stack-$version-Windows-x64.exe"
          $metadata = 'artifacts/installer/Air-Stack-installer.json'
          $hashFile = "artifacts/installer/Air-Stack-$version-Windows-x64.exe.sha256"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Air-Stack-$version-Windows-x64.exe" | Set-Content -LiteralPath $hashFile -Encoding ascii

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $metadata $hashFile --clobber
          } else {
            gh release create $tag $installer $metadata $hashFile `
              --title "Air Stack $version" `
              --notes "Air Stack $version Windows x64 installer built and installed/uninstalled on GitHub-hosted Windows. Product version unchanged."
          }
